# main 브랜치에 push하면 자동으로 빌드해서 S3에 올리고 CloudFront 캐시를 비운다.
# 키 2개만 GitHub 저장소 Settings → Secrets and variables → Actions → Secrets 에 등록한다.
#   AWS_ACCESS_KEY_ID          배포용 IAM 사용자의 Access Key
#   AWS_SECRET_ACCESS_KEY      배포용 IAM 사용자의 Secret Key
# 버킷·리전·배포 ID는 비밀값이 아니라서 아래 env에 직접 적어 둔다.
# API 주소는 저장소에 있는 .env.production 값이 빌드에 그대로 들어간다.

name: Deploy to S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 수동 실행도 가능

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-northeast-2
      S3_BUCKET: capstone-securecam-web-hyu
      CLOUDFRONT_DISTRIBUTION_ID: E2DX2I0GZPAIBM

    steps:
      - name: 필요한 Secrets 확인
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          missing=""
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::GitHub Secrets에 다음 값이 없습니다:$missing"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: 빌드
        run: npm run build
        env:
          # CRA는 CI=true면 ESLint 경고도 빌드 실패로 처리하므로 끈다
          CI: false

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: S3 업로드
        run: |
          # 파일명에 해시가 붙는 JS/CSS는 오래 캐시
          aws s3 sync build/static "s3://$S3_BUCKET/static" \
            --cache-control "public,max-age=31536000,immutable"
          # index.html 등 나머지는 매번 새로 받게 함
          aws s3 sync build "s3://$S3_BUCKET" \
            --exclude "static/*" \
            --cache-control "no-cache"

      - name: CloudFront 캐시 무효화
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"
